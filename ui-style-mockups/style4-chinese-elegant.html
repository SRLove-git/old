<!doctype html>

<style>

  .member span { font-size:13px; color:#9a8877; }

  .card { background:#fffdf8; border:1.5px solid #e4d5b5; border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .cover { height:96px; display:flex; align-items:center; justify-content:center; font-size:44px; color:#fff; position:relative; }
  .cover span { position:absolute; left:12px; bottom:10px; background:rgba(90,40,20,.45); color:#fff; font-size:12px; border-radius:8px; padding:4px 10px; }
  .body { padding:14px 16px 16px; }
  .title { font-size:17px; font-weight:800; line-height:1.35; }
  .meta { font-size:13px; color:#9a8877; margin:7px 0 12px; }
  .foot { display:flex; justify-content:space-between; align-items:center; }
  .price { font-size:20px; font-weight:800; color:#a62b2b; }
  .price small { font-size:12px; color:#9a8877; font-weight:400; }
  .go { background:#c9a15c; color:#3a2c22; border-radius:10px; padding:9px 18px; font-size:14px; font-weight:800; }
  .tab { position:fixed; left:0; right:0; bottom:0; height:78px; background:#fffdf8; border-top:1px solid #e4d5b5; display:flex; }
  .tab div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#9a8877; font-size:12px; gap:3px; }
  .tab div.on { color:#a62b2b; font-weight:800; }
  .tab .e { font-size:22px; }
